# Iraqi Legal Translation Agent — runtime configuration.
# Defaults target the 8 GB RAM offline profile (see README.md §3).
# All paths are relative to the project root.

# --- LLM / embedding runtime ---
# Backend selection:
#   ollama  — local daemon (default, offline). Requires `ollama serve`.
#   llamacpp — local llama.cpp server (offline).
#   gemini  — opt-in Google Gemini API cloud backend. Requires the
#             GEMINI_API_KEY environment variable (NEVER write the key
#             here). Lazily imports google-genai; enforces a process-local
#             RPM cap. See README.md §5.4.
llm_backend: ollama          # ollama | llamacpp | gemini
ollama_host: http://localhost:11434
llamacpp_url: http://localhost:8080

# Model names (must be pulled via `ollama pull` before running).
# Used by the ollama / llamacpp backends; ignored when llm_backend: gemini.
llm_model: gemma3:4b
embed_model: nomic-embed-text

# Ollama KV-cache context size (num_ctx in the Ollama options dict). Caps the
# VRAM footprint of the LLM's KV cache so the embed model and gemma3:4b coexist
# within an 8 GB GPU. Independent of `context_window` (the pipeline-level
# prompt-truncation budget). Default 2048 is the safe value for the 8 GB target
# profile; raise it on GPUs with more VRAM.
ollama_num_ctx: 2048

# --- Gemini API backend (used only when llm_backend: gemini) ---
# The API key is read from the GEMINI_API_KEY environment variable, NOT
# from this file (security — never commit a key to config.yaml).
gemini_model: gemini-2.0-flash         # chat model
gemini_embed_model: text-embedding-004 # 768-dim embed model (matches EMBED_DIM)
gemini_timeout: 120.0                  # seconds per generation / embed batch
gemini_rpm: 15                         # Gemini free-tier requests-per-minute cap

# --- Paths (relative to project root) ---
paths:
  data_dir: data
  corpus_dir: data/corpus
  glossary_dir: data/glossary
  raw_dir: data/raw
  db_dir: db
  glossary_db: db/glossary.sqlite
  chroma_dir: db/chroma

# --- Ingestion / retrieval tuning ---
chunk_size: 512              # target tokens per chunk
chunk_overlap: 64            # overlap tokens between adjacent chunks
top_k: 3                     # context chunks retrieved per query
embedding_batch_size: 32     # max texts per embed call (RAM cap)
chroma_add_batch: 64         # max chunks per ChromaDB add (flush threshold)

# --- Agent loop ---
max_revisions: 1             # translator<->auditor revision cap
context_window: 8192         # LLM context window in tokens
translator_temperature: 0.0
auditor_temperature: 0.0
translator_max_tokens: 2048
auditor_max_tokens: 2048
llm_timeout: 120.0           # seconds per generation

# --- ChromaDB HNSW index tuning (small corpus, low RAM) ---
chroma:
  space: cosine              # nomic-embed-text is cosine-normalized
  hnsw_M: 8
  construction_ef: 64
  search_ef: 32

# --- Translation Memory (TM) ---
tm_enabled: true
tm_similarity_threshold: 0.98
tm_db: db/tm.sqlite

# --- Human-in-the-loop (HITL) ---
# When true, the pipeline pauses after the audit loop for human review.
# The human can approve the draft or edit it; edits go back through the
# auditor and corrections are saved to hitl_feedback_dir as JSONL for
# fine-tuning / TM enrichment.
hitl_enabled: false
hitl_feedback_dir: data/feedback

# --- Web search (Iraqi legal sources) ---
# When true, the pipeline searches Iraqi legal databases (Ministry of Justice,
# National Library, Dijlex, UR Portal) during translation to ground the
# translator with real law names, article text, and official terminology.
# Disabled by default — requires internet access and adds ~5-15s per translation.
web_search_enabled: false
web_search_max_results: 5

# --- Excel (.xlsx) workbook translation ---
# Controls which human-readable text locations the `excel` CLI command
# translates. Non-text artifacts (formulas, merged cells, charts, images,
# comments structure, conditional formatting, data validation, page layout)
# are always preserved byte-for-byte; these toggles only select which text
# gets routed through the translation pipeline.
excel:
  translate_comments: true
  translate_headers_footers: true
  translate_chart_titles: true
  max_segment_chars: 4096    # segments longer than this are skipped (original kept)
  max_xlsx_bytes: 104857600  # 100 MiB — workbooks larger than this are rejected
  max_segments: 10000        # workbooks with more translatable segments are rejected

# --- Word (.docx) document translation ---
# `word` command translates a .docx in place. Toggles select which text
# locations are routed through the pipeline; all non-text artifacts (styles,
# tables, images, tracked changes, hyperlinks) are preserved byte-for-byte.
# `translate_glossary_doc` is false by default — the glossaryDocument part is
# a term-definition reference, not translatable content.
word:
  translate_comments: true
  translate_headers_footers: true
  translate_footnotes: true
  translate_endnotes: true
  translate_glossary_doc: false
  max_segment_chars: 8192    # segments longer than this are skipped (original kept)
  max_docx_bytes: 52428800   # 50 MiB — documents larger than this are rejected
  max_segments: 20000        # documents with more translatable segments are rejected

# --- PDF (.pdf) document translation (sidecar output) ---
# `pdf` command extracts text per page, translates it, and writes a sidecar
# file (.docx by default, or .txt). The original PDF is never rewritten.
# `skip_header_footer` drops short page-header/footer lines that pypdf emits
# inline with the body text on each page.
pdf:
  out_format: docx           # "docx" (default) or "txt"
  max_pdf_bytes: 104857600   # 100 MiB — PDFs larger than this are rejected
  max_pages: 500             # PDFs with more pages are rejected
  max_segment_chars: 8192    # segments longer than this are skipped (original kept)
  max_segments: 20000        # PDFs with more translatable segments are rejected
  skip_header_footer: true

# --- UI backend selection ---
# `ui` command launches a desktop UI. `web` uses pywebview (HTML/CSS/JS),
# `tk` uses Tkinter (native widgets, no browser dependency).
ui:
  backend: web
